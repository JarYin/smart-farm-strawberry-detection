# =====================================================================
#  Smart Farm Autonomous Robot — ไฟล์ตั้งค่ากลางของระบบ
#  ทุกสคริปต์ใน src/ และ tools/ อ่านค่าจากไฟล์นี้ไฟล์เดียว
#  แก้ค่าที่นี่ ไม่ต้องไปแก้ในโค้ด
#
#  ⚠️ ไฟล์นี้อยู่บน branch prototype-v1 = "ต้นแบบสำหรับนำเสนอผลงาน"
#     ตั้งค่าไว้ให้ตรวจจับ "สี" แทนการใช้โมเดล AI เพื่อสาธิตหน้างานได้ทันที:
#         แผ่นสีแดง  = ต้นสตรอว์เบอร์รี (พืชเป้าหมาย) -> เลเซอร์ "ไม่" ทำงาน
#         แผ่นสีเขียว = วัชพืช                          -> เลเซอร์ยิง
#         ไม่เจออะไรเลย                                 -> เลเซอร์ยิง (ถือว่าไม่ใช่พืชหลัก)
#     ตรรกะการตัดสินใจ (ROI, ยืนยันหลายเฟรม, กันทำงานค้าง, เครื่องสถานะ) ยังเป็น
#     ชุดเดียวกับระบบจริงทุกบรรทัด เปลี่ยนแค่ "ตาที่ใช้มอง" กับ "อุปกรณ์ปลายทาง"
#
#     กลับไปใช้โมเดล AI ตัวจริง: ตั้ง model.backend: auto แล้วแก้หมวด classes
#     กลับเป็น names/target/weed ของโมเดล (ดูค่าที่เคยใช้ในคอมเมนต์ของหมวดนั้น)
#     หรือสั่งชั่วคราวจากบรรทัดคำสั่ง:  python -m src.main --backend auto
# =====================================================================

# ---------------------------------------------------------------------
# 1) กล้อง (The Vision)
# ---------------------------------------------------------------------
camera:
  # source: webcam    -> กล้องเว็บแคม/USB บน PC (ใช้ตอนพัฒนา)
  #         picamera2 -> Pi Camera OV5647 ผ่าน libcamera (ใช้บน Raspberry Pi)
  #         video     -> ไฟล์วิดีโอ .mp4 (ใช้ทดสอบซ้ำๆ ด้วยคลิปเดิม)
  #         images    -> โฟลเดอร์รูปภาพ (ใช้ทดสอบ Testbed แบบเลื่อนภาพทีละใบ)
  source: webcam
  index: 0                # ใช้เมื่อ source = webcam (0 คือกล้องตัวแรก)
  path: ""                # ใช้เมื่อ source = video หรือ images
  loop: true              # เล่นวนซ้ำ (เฉพาะ video / images)
  hold_frames: 15         # แสดงภาพละกี่เฟรม (เฉพาะ source = images)
  width: 640              # ความละเอียดที่ดึงจากกล้อง (ไม่ใช่ขนาดที่เข้าโมเดล)
  height: 480
  fps: 30
  flip_horizontal: false  # พลิกภาพ ถ้าติดตั้งกล้องกลับด้าน
  flip_vertical: false
  warmup_frames: 5        # ทิ้งเฟรมแรกๆ ให้กล้องปรับ auto-exposure ก่อน

# ---------------------------------------------------------------------
# 2) โมเดล AI (The Brain)
# ---------------------------------------------------------------------
model:
  # backend: auto        -> เดาจากนามสกุลไฟล์ (.pt = ultralytics, .tflite = tflite)
  #          ultralytics -> ใช้ไลบรารี ultralytics (สำหรับ PC / ตอนพัฒนา)
  #          tflite      -> ใช้ tflite-runtime ล้วนๆ (สำหรับ Raspberry Pi, เบากว่ามาก)
  #          roboflow    -> เรียกโมเดลบนคลาวด์ผ่าน API (ดูหมวด roboflow ด้านล่าง)
  #                         ใช้ทดสอบเร็วๆ เท่านั้น "ห้าม" ใช้ควบคุมปั๊มแบบเรียลไทม์บน Pi จริง
  #                         เพราะต้องพึ่งอินเทอร์เน็ตและมี latency เครือข่ายเพิ่มทุกเฟรม
  #          color       -> ตรวจจับ "สี" ด้วย HSV ล้วนๆ ไม่ใช้โมเดล AI และไม่ต้องมีไฟล์
  #                         น้ำหนักเลย (ดูหมวด color ด้านล่าง) — โหมดของ prototype-v1
  backend: color
  weights: models/best.pt   # ไม่ถูกใช้เมื่อ backend: color (เก็บไว้ให้สลับกลับได้ทันที)
  imgsz: 320                # ขนาดภาพเข้าโมเดล ตามที่กำหนดในเอกสาร (320x320)
  # conf: เมื่อ backend: color ค่านี้ไม่ใช่ความมั่นใจของ AI แต่คือ "fill ratio" ขั้นต่ำ =
  # สัดส่วนพื้นที่สีจริงต่อพื้นที่กรอบสี่เหลี่ยม บอกว่าก้อนสีนั้นเป็นแผ่นทึบจริงหรือแค่ขอบสีเลอะๆ
  # แผ่นสี่เหลี่ยมได้ ~0.90-1.00 | วงกลมได้ ~0.79 | เงาสะท้อน/ขอบวัตถุมักต่ำกว่า 0.50
  # ตั้ง 0.45 เพื่อรับได้ทั้งแผ่นสี่เหลี่ยม ทรงกลม และวัตถุรูปร่างไม่เรียบพอสมควร แต่ยังตัด
  # ริ้วสี/เงาสะท้อนที่กระจายเป็นเส้นบางๆ ทิ้ง (ค่าเดิมของโหมดโมเดล AI คือ 0.40)
  conf: 0.45
  iou: 0.45                 # ค่า IoU สำหรับ NMS (ไม่ถูกใช้เมื่อ backend: color)
  max_det: 20               # จำนวนวัตถุสูงสุดต่อเฟรม
  num_threads: 4            # จำนวน CPU thread ของ TFLite (Pi 4 มี 4 คอร์)

# ---------------------------------------------------------------------
# 2.1) โมเดลบน Roboflow (คลาวด์) — ใช้เมื่อ model.backend: roboflow เท่านั้น
#      ห้ามใส่ api key ไว้ในไฟล์นี้เด็ดขาด! ตั้งเป็นตัวแปรสภาพแวดล้อมแทน:
#        PowerShell:  $env:ROBOFLOW_API_KEY = "คีย์ของคุณ"
#        Bash      :  export ROBOFLOW_API_KEY="คีย์ของคุณ"
# ---------------------------------------------------------------------
roboflow:
  api_url: https://serverless.roboflow.com
  model_id: strawberry-detection-msf0m/3   # <-- เปลี่ยนเป็นโมเดลที่ต้องการ (รูปแบบ ชื่อ/เวอร์ชัน)
  api_key_env: ROBOFLOW_API_KEY            # ชื่อตัวแปรสภาพแวดล้อมที่เก็บ API key
  timeout_seconds: 10

# ---------------------------------------------------------------------
# 3) การจำแนกคลาส — หัวใจของการตัดสินใจ
#    names ต้องเรียงตาม class id ใน data.yaml ของ dataset เป๊ะๆ
# ---------------------------------------------------------------------
classes:
  # ---- ค่าของ prototype-v1 (backend: color) ----
  # ชื่อสองชื่อนี้ต้องตรงกับ color.red_name / color.green_name ในหมวด color เป๊ะๆ
  # ถ้าไม่ตรง logic จะจัดทุกกล่องเป็น "คลาสที่ไม่รู้จัก" แล้วตัดสินใจผิดทั้งหมด
  # (src/detector.py -> build_detector จะพิมพ์คำเตือนให้ถ้าตั้งไม่ตรงกัน)
  names: [red-object, green-object]
  target: [red-object]     # สีแดง = สตรอว์เบอร์รี (พืชเป้าหมาย) -> เลเซอร์ไม่ทำงาน
  weed:   [green-object]   # สีเขียว = วัชพืช                     -> เลเซอร์ยิง
  #
  # ---- ค่าเดิมของโหมดโมเดล AI (สลับกลับได้เมื่อ backend ไม่ใช่ color) ----
  # โมเดล models/best.pt มีคลาสเดียวคือ Strawberry-Plant (ตรวจแค่ "มีต้น/ผลสตรอว์เบอร์รี
  # อยู่ไหม" ไม่แยกสุก/ไม่สุก) — ต้องตรงกับชื่อคลาสในตัวโมเดลจริงเป๊ะๆ เพราะ src/detector.py
  # (UltralyticsDetector) ยึดชื่อคลาสจากโมเดลเป็นหลักเสมอ ถ้าตรงนี้ไม่ตรง ระบบจะไม่มีวัน
  # จัดว่า detection ใดๆ เป็น "target" เลย -> พ่นค้างทุกเฟรม (โหมดผกผัน)
  #   names: [Strawberry-Plant]
  #   target: [Strawberry-Plant]
  #   weed:   []
  #   per_class_conf: {Strawberry-Plant: 0.40}

  # คลาสที่ไม่อยู่ใน target และ weed จะทำตามนโยบายนี้
  #   ignore = ไม่สนใจ (ปลอดภัยกว่า)  |  weed = ถือว่าเป็นวัชพืช
  unknown_policy: ignore

  # โหมดผกผัน (Inverse / Crop-vs-Non-crop) — เปิดไว้ เพราะเป็นหัวใจของกฎข้อที่สาม
  # ("ตรวจจับอะไรไม่ได้เลย -> ก็ยิง") ตารางการตัดสินใจของโหมดนี้คือ:
  #     พบสีแดงในเขต             -> ไม่ยิง (งดทั้งเขต ป้องกันพืชหลักไว้ก่อน)
  #     ไม่พบแดง + พบสีเขียว      -> ยิง โดยชี้เป้าไปที่กล่องสีเขียวจริง
  #     ไม่พบอะไรเลยในเขต        -> ยิง โดยใช้กล่องสังเคราะห์ครอบทั้งเขต
  # ถ้าปิดโหมดนี้ (false) ระบบจะกลับไปเป็นตรรกะปกติ = ต้องเจอสีเขียวจริงเท่านั้นถึงจะยิง
  # (กฎข้อ "ไม่เจออะไรเลยก็ยิง" จะหายไป) — ตั้ง true ไว้ตามที่ต้องการ
  inverse_mode: true

  # ตั้งเกณฑ์เฉพาะคลาสได้ (ถ้าไม่ระบุจะใช้ model.conf) — โหมดสีใช้ค่ากลางค่าเดียวก็พอ
  # ⚠️ ระวัง: src/detector.py -> effective_conf() กรองที่ชั้น detector ด้วย "ค่าต่ำสุด"
  # ของทั้ง model.conf และค่าในนี้ ถ้าตั้งคลาสใดต่ำกว่า model.conf ก้อนสีที่ fill ratio ต่ำ
  # จะหลุดเข้ามาถึงชั้นตรรกะของทุกคลาส (แล้วค่อยถูกคัดออกทีหลัง) ไม่ใช่แค่คลาสนั้น
  per_class_conf: {}

# ---------------------------------------------------------------------
# 3.05) การตรวจจับด้วยสี (HSV Color Detection) — ใช้เมื่อ model.backend: color
#       หัวใจของ prototype-v1: แทนวัตถุจริงด้วยแผ่นสี ทำให้สาธิตได้ทุกที่ทันที
#
#       ค่า HSV ของ OpenCV: H = 0-179 (ไม่ใช่ 0-359!), S = 0-255, V = 0-255
#       H (Hue)        = เนื้อสี      -> ใช้แยกว่าแดงหรือเขียว
#       S (Saturation) = ความสด      -> กันสีเทา/ขาว/เงาที่ "จืด" ไม่ใช่สีจริง
#       V (Value)      = ความสว่าง   -> กันบริเวณมืดจนแยกสีไม่ออก
#
#       ปรับค่าเหล่านี้ให้เข้ากับแสงหน้างานด้วยเครื่องมือช่วยจูน (มีแถบเลื่อนให้ลากสดๆ):
#           python tools/color_tune.py
# ---------------------------------------------------------------------
color:
  # ---- สีแดง = สตรอว์เบอร์รี (พืชเป้าหมาย) ----
  red_name: red-object
  # สีแดงอยู่คร่อมจุดเริ่มต้นของวงล้อสี (hue ใกล้ 0 และใกล้ 179) จึงต้องใช้ "สองช่วง" เสมอ
  # นี่คือกับดักคลาสสิกของการตรวจจับสีแดง — ถ้าใส่ช่วงเดียวจะจับได้แค่ครึ่งเดียวของเฉดแดง
  red_hue_ranges: [[0, 10], [170, 179]]
  red_sat_min: 90     # แดงต้องสดพอควร กันพื้นไม้/ผิวคน/สีน้ำตาลที่ hue ใกล้กัน
  red_val_min: 60

  # ---- สีเขียว = วัชพืช ----
  green_name: green-object
  green_hue_ranges: [[35, 85]]   # ครอบตั้งแต่เขียวอมเหลืองถึงเขียวอมฟ้า
  green_sat_min: 70
  green_val_min: 50

  # ---- การประมวลผลภาพร่วมกันทั้งสองสี ----
  blur_ksize: 5        # เบลอก่อนแปลง HSV ลด noise ของเซนเซอร์ (ต้องเป็นเลขคี่ หรือ 0 = ไม่เบลอ)
  morph_ksize: 5       # ลบจุดรบกวน (open) แล้วอุดรูในแผ่นสี (close) — เลขคี่ หรือ 0 = ไม่ทำ
  min_area_frac: 0.004 # กล่องต้องมีพื้นที่อย่างน้อยเท่านี้เทียบกับเฟรม (~0.4% = 40x30 px บนภาพ 640x480)
  max_area_frac: 0.90  # กันกรณีแสงทั้งฉากกลายเป็นสีเดียว แล้วได้กล่องเต็มจอ

# ---------------------------------------------------------------------
# 3.1) ตัวกรองรูปทรงกล่อง (Geometric Plausibility Filter) — เลเยอร์เสริมลด false positive
#      ตัด detection ที่ aspect ratio (กว้าง/สูง) หรือขนาดเทียบกับเฟรมผิดปกติชัดๆ ทิ้ง
#      ก่อนเข้า logic การพ่น (ดู src/logic.py -> SprayController.analyze())
# ---------------------------------------------------------------------
geometry_filter:
  # ปิดไว้ในโหมดสี (prototype-v1): ขอบเขต aspect/area ด้านล่างวัดมาจากกล่องของ "ต้น
  # สตรอว์เบอร์รีจริง" ไม่ใช่แผ่นสีที่ถือขึ้นมาสาธิต ถ้าเปิดไว้จะตัดแผ่นสีทิ้งเกือบทั้งหมด
  # (แผ่นสีมักเล็กกว่า min_area_frac = 0.075 ของเฟรม) และตัวตรวจจับสีมีตัวกรองขนาด
  # ของตัวเองอยู่แล้วที่ color.min_area_frac / color.max_area_frac
  # ⚠️ เปิดกลับเป็น true ทุกครั้งที่สลับ backend กลับไปใช้โมเดล AI
  enabled: false
  # ค่าเหล่านี้วัดจากกล่อง true positive จริงใน test_images/ (conf=0.15, n=9 กล่อง จาก 3 ภาพ)
  # aspect ratio จริงอยู่ 0.289-1.955 และ area_frac จริงอยู่ 0.083-0.464 แล้วเผื่อ margin 10%
  # ⚠️ sample เล็กมาก (9 กล่องจาก 3 ภาพ) ควรวัดใหม่เมื่อมีภาพ true positive เพิ่ม (เช่นจากการ
  # คัดกรอง datasets/hard_negatives/_excluded_true_positives/ ที่เป็นภาพสตรอว์เบอร์รีจริง)
  # ทดสอบแล้ว (2026-08-07): ที่ conf=0.40 ตัวกรองนี้ไม่ตัด true positive แม้แต่กล่องเดียว
  # แต่ลดเฟรม false-positive ใน datasets/hard_negatives/ จาก 18/30 เหลือ 11/30 (~39%)
  # ย้ำอีกครั้ง: เป็นตัวช่วยเสริม ไม่ใช่ทางแก้ปัญหา false positive ทั้งหมด (11/30 ยังหลุดอยู่)
  min_aspect: 0.26      # กว้าง/สูง ต่ำสุด (กล่องแคบสูงผิดปกติจะถูกตัด)
  max_aspect: 2.15      # กว้าง/สูง สูงสุด (กล่องแบนกว้างผิดปกติจะถูกตัด)
  min_area_frac: 0.075  # สัดส่วนพื้นที่กล่องต่อพื้นที่เฟรม ต่ำสุด (กล่องเล็กจิ๋วผิดปกติจะถูกตัด)
  max_area_frac: 0.511  # สัดส่วนพื้นที่กล่องต่อพื้นที่เฟรม สูงสุด (กล่องเต็มเฟรมผิดปกติจะถูกตัด)

# ---------------------------------------------------------------------
# 4) ขอบเขตการพ่น (ROI - Region of Interest)
#    หัวฉีดพ่นครอบคลุมแค่บางส่วนของภาพ ไม่ใช่ทั้งเฟรม
#    ค่าเป็นสัดส่วน 0.0-1.0 ของความกว้าง/สูงภาพ (0,0 = มุมบนซ้าย)
# ---------------------------------------------------------------------
roi:
  enabled: true
  x1: 0.15
  y1: 0.45      # สนใจเฉพาะครึ่งล่างของภาพ = พื้นที่ตรงหน้าหัวฉีด
  x2: 0.85
  y2: 1.00
  # require: center  -> จุดกึ่งกลางกล่องต้องอยู่ใน ROI (เข้มงวด แนะนำ)
  #          overlap -> แค่กล่องซ้อนทับ ROI ก็พอ (ไวกว่า)
  require: center

# ---------------------------------------------------------------------
# 5) ตรรกะการสั่งพ่น (Spray Logic) — กันการพ่นผิดพลาดและกันพ่นค้าง
# ---------------------------------------------------------------------
spray:
  # confirm_frames ปรับจาก 3 -> 5 (2026-08-07) เพื่อกัน false positive แบบชั่ววูบเพิ่มอีกชั้น
  # (เช่น มือ/สิ่งของโบกผ่านหน้ากล้อง 1-2 เฟรม) — ของจริง (ต้นที่อยู่นิ่ง) ยังผ่านเกณฑ์นี้ได้ปกติ
  # เพิ่ม latency ~0.1-0.3 วินาทีที่เฟรมเรต 15-30fps ซึ่งน้อยเทียบกับ min_on_seconds ด้านล่าง
  # release_frames ปรับลงเหลือ 4 (จาก 5) ให้ "หยุดพ่นไวกว่าเริ่มพ่น" เอนเอียงไปทางปลอดภัยไว้ก่อน
  # (โหมดผกผัน: ถ้าไม่แน่ใจ ให้เชื่อว่ามีพืชเป้าหมายอยู่ -> งดพ่น ดีกว่าพ่นผิด)
  confirm_frames: 5        # ต้องเจอวัชพืชติดกันกี่เฟรมถึงจะเริ่มทำงาน (กันภาพเบลอหลอก)
  release_frames: 4        # ต้องไม่เจอติดกันกี่เฟรมถึงจะหยุด
  min_on_seconds: 0.60     # เมื่อเริ่มแล้ว ต้องทำงานอย่างน้อยเท่านี้ (ให้ยาออกทัน/ลำแสงโดนเป้า)
  # max_on_seconds: ระบบกันทำงานค้าง เกินเวลานี้ตัดทันทีไม่ว่ากรณีใด
  # ⚠️ ค่าเดิมของระบบปั๊มจริงคือ 5.00 วินาที (ยาในถังมีจำกัด พ่นค้างแปลว่ายาหมดถัง)
  # prototype-v1 ขยับเป็น 30.00 เพราะกฎ "ไม่เจออะไรเลย -> ยิง" ทำให้ฉากว่างเปล่าสั่งยิง
  # ค้างตลอด ถ้ายังตัดที่ 5 วินาที เลเซอร์จะกะพริบ 5 วินาทีติด/1 วินาทีดับ ระหว่างนำเสนอ
  # ซึ่งผู้ชมจะเข้าใจผิดว่าระบบทำงานผิดพลาด — เลเซอร์ไม่มีข้อจำกัดเรื่องปริมาณเหมือนถังยา
  # จึงยืดเวลาได้ แต่ยังคงกลไกตัดไว้ (ไม่ตั้งเป็นอนันต์) เพื่อรักษาหลักการกันค้างของระบบเดิม
  # ตั้งกลับเป็น 5.00 เมื่อสลับไปคุมปั๊มจริง
  max_on_seconds: 30.00
  cooldown_seconds: 1.00   # หลังหยุด ต้องพักเท่านี้ก่อนเริ่มครั้งถัดไป
  # ป้องกันสารเคมีโดนพืชหลัก: ถ้ากล่องวัชพืชทับ/ชิดกับกล่องพืชเป้าหมาย -> ไม่พ่น
  # ไม่มีผลเมื่อ classes.inverse_mode: true (โหมดผกผันงดพ่นทั้งเขตทันทีที่เจอ
  # พืชเป้าหมายในเขต ซึ่งป้องกันพืชหลักเข้มงวดกว่าการเช็คระยะห่างเป็นรายกล่องอยู่แล้ว)
  protect_crop: true
  protect_margin_px: 20    # ระยะกันชนรอบกล่องพืชเป้าหมาย (พิกเซล)

# ---------------------------------------------------------------------
# 6) รีเลย์ควบคุมปั๊ม (The Action)
# ---------------------------------------------------------------------
relay:
  # backend: auto -> ใช้ GPIO จริงถ้าอยู่บน Pi, ไม่งั้นใช้ mock (พิมพ์ข้อความแทน)
  #          gpiozero | rpigpio | mock
  backend: auto
  pin: 17                  # ขา GPIO (BCM numbering) = ขากายภาพที่ 11
  # โมดูลรีเลย์ราคาถูกส่วนใหญ่เป็น Active LOW (ส่ง 0 = รีเลย์ทำงาน)
  # ถ้าตั้งผิด ปั๊ม/เลเซอร์จะทำงานทันทีที่เปิดเครื่อง! ทดสอบด้วย tools/relay_test.py ก่อน
  active_high: false
  # actuator: pump  -> ปั๊มพ่นยา (ระบบจริง)
  #           laser -> เลเซอร์ (prototype-v1 ที่ใช้นำเสนอผลงาน)
  # เปลี่ยนแค่ "คำที่แสดง" บนหน้าจอและคอนโซล (ปั๊ม/พ่น <-> เลเซอร์/ยิง) ไม่กระทบตรรกะ
  # สัญญาณ GPIO หรือรูปแบบไฟล์ CSV เลย (คอลัมน์ pump และเหตุการณ์ SPRAY_START ยังชื่อเดิม
  # เพื่อให้ tools/report_events.py อ่านไฟล์เก่ากับไฟล์ใหม่ด้วยสคริปต์เดียวกันได้)
  actuator: laser

# ---------------------------------------------------------------------
# 7) การทำงานขณะรัน (Runtime)
# ---------------------------------------------------------------------
runtime:
  show_window: true              # แสดงหน้าต่างวิดีโอ (ปิดเมื่อรันบน Pi แบบ headless)
  save_video: ""                 # ใส่ path เช่น logs/run.mp4 เพื่อบันทึกวิดีโอผลลัพธ์
  log_csv: logs/events.csv       # ไฟล์บันทึกเหตุการณ์ (ใช้ทำผลการทดลอง บทที่ 4)
  snapshot_dir: logs/snapshots   # โฟลเดอร์เก็บภาพตอนสั่งพ่น
  save_snapshots: true
  print_every: 30                # พิมพ์สถานะทุกๆ กี่เฟรม (0 = ไม่พิมพ์)

# ---------------------------------------------------------------------
# 8) ค่าเริ่มต้นสำหรับการเทรน (tools/train.py)
# ---------------------------------------------------------------------
train:
  data: datasets/data.yaml   # ไฟล์ data.yaml จาก Roboflow
  base_model: yolov8n.pt     # YOLOv8 Nano ตามที่กำหนดในเอกสาร
  epochs: 120
  batch: 16
  imgsz: 320
  patience: 30               # หยุดก่อนกำหนดถ้าไม่ดีขึ้น
  device: ""                 # "" = auto, "0" = GPU ตัวแรก, "cpu" = ใช้ CPU
  project: runs/train
  name: yolov8n_320
